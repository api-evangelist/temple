name: Temple
description: 'Temple Capital is a cryptocurrency trading firm founded in 2018 that specializes in the
  algorithmic trading of liquid digital assets using machine learning technology. The firm has a seven-year
  live fund track record and manages over $75 million in assets on behalf of a diversified investor base,
  supported by a team of roughly 25 investment professionals across quantitative research, engineering,
  and operations. Backed by investors including Pantera Capital and Bain Capital, Temple Capital operates
  as a quantitative crypto hedge fund and does not currently publish a first-party developer API; its
  temple.capital marketing site is Wix-hosted and exposes a generic Wix Site MCP endpoint for AI agents.'
